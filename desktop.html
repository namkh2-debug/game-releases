<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d1017">
<meta name="color-scheme" content="dark">
<title>오늘의 게임 출시 (KST) · 데스크톱</title>
<style>
  /* 데스크톱(가로 화면) 전용: 3개 열을 한 화면에. 기준 크기는 화면 높이에 맞춰 자동 조정
     (1080p ≈ 17px, 768p ≈ 12px). 넘치면 각 열 내부만 스크롤. */
  :root{--bg:#0d1017;--panel:#151a24;--panel2:#1b2130;--line:#262e3d;--text:#e8ecf3;--muted:#8b95a7;
        --steam:#66c0f4;--ps:#3b82f6;--sw:#e60012;--warn:#f5b041;--gap:clamp(10px,1.1vh,16px)}
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg);font-size:clamp(12px,min(1.75vh,0.95vw),18px);height:100%}
  body{background:var(--bg);color:var(--text);line-height:1.4;height:100%;overflow:hidden;
    font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
  .wrap{height:100vh;height:100dvh;display:flex;flex-direction:column;gap:var(--gap);
    padding:var(--gap) clamp(12px,1.25vw,28px);min-height:0}

  /* 헤더: 제목·날짜 | 갱신/다음 새로고침 | 시계 */
  header{flex:none;display:flex;align-items:center;gap:2rem;padding-bottom:var(--gap);border-bottom:1px solid var(--line)}
  h1{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;line-height:1.2;white-space:nowrap}
  #today{font-size:1.05rem;color:var(--muted);font-weight:500;margin-left:.8rem}
  .meta{margin-left:auto;display:flex;gap:1.6rem;color:var(--muted);font-size:1rem;white-space:nowrap}
  .meta b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
  .clock{font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.1;
    padding-left:1.6rem;border-left:1px solid var(--line)}

  #warn{display:none;flex:none;background:#3a2a0d;color:var(--warn);border:1px solid var(--warn);
    border-radius:10px;padding:.45rem .9rem;font-weight:600;font-size:1rem}

  /* 3열 보드 */
  main{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap)}
  section{display:flex;flex-direction:column;min-height:0;background:#10141c;border:1px solid var(--line);
    border-top:3px solid var(--c);border-radius:12px;overflow:hidden}
  section h2{flex:none;display:flex;align-items:center;gap:.6rem;font-size:1.15rem;font-weight:800;
    padding:.55rem .85rem;background:color-mix(in srgb,var(--c) 12%,var(--panel));border-bottom:1px solid var(--line)}
  section h2 .count{margin-left:auto;min-width:1.7rem;height:1.7rem;padding:0 .55rem;border-radius:999px;background:var(--c);
    color:var(--on);font-size:.95rem;font-weight:800;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
  .steam{--c:var(--steam);--on:#04121c} .ps{--c:var(--ps);--on:#fff} .sw{--c:var(--sw);--on:#fff}
  .body{flex:1;min-height:0;overflow-y:auto;padding:.6rem;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  .body::-webkit-scrollbar{width:8px} .body::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  .list{list-style:none;display:flex;flex-direction:column;gap:.5rem}
  .card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:9px;
    padding:.5rem .75rem .55rem;min-width:0}
  .card h3{font-size:1.07rem;font-weight:700;line-height:1.3;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:anywhere}
  .card h3 .en{color:#b8c1d1;font-weight:500}
  .chips{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.35rem}
  .chip{display:inline-flex;align-items:baseline;gap:.35rem;max-width:100%;font-size:.86rem;line-height:1.3;
    padding:.12rem .55rem;border-radius:999px;background:var(--panel2);border:1px solid var(--line);
    overflow-wrap:anywhere;word-break:keep-all}
  .chip .k{color:var(--muted);font-weight:600;flex:none}
  .chip .v{min-width:0}
  .unk{color:var(--muted);font-style:italic;font-weight:400}
  .note{align-self:center;padding:.12rem .1rem;color:var(--warn);font-size:.86rem;line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
  .note::before{content:"비고 · ";color:var(--muted);font-weight:600}
  .empty{padding:2rem 1rem;text-align:center;color:var(--muted);font-size:1rem;border:1px dashed var(--line);border-radius:10px}

  footer{flex:none;color:var(--muted);font-size:.85rem;display:flex;justify-content:space-between;gap:1rem;white-space:nowrap}

  /* 좁은 가로 화면(<1100px)에서는 메타를 줄바꿈 */
  @media (max-width:1100px){ header{flex-wrap:wrap;gap:.4rem 1.2rem} .meta{order:3;margin-left:0;width:100%} .clock{margin-left:auto} }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>오늘의 게임 출시<span id="today">-</span></h1>
  <div class="meta">
    <div>데이터 갱신 <b id="updated">-</b></div>
    <div>다음 새로고침 <b id="next">-</b></div>
  </div>
  <div class="clock" id="clock" aria-label="현재 한국시간">--:--:--</div>
</header>
<div id="warn" role="alert"></div>

<main>
  <section class="steam" id="p-steam" aria-labelledby="h-steam"><h2 id="h-steam">STEAM <span class="count" id="n-steam">0</span></h2><div class="body" id="t-steam" tabindex="0"></div></section>
  <section class="ps" id="p-playstation" aria-labelledby="h-playstation"><h2 id="h-playstation">PlayStation <span class="count" id="n-playstation">0</span></h2><div class="body" id="t-playstation" tabindex="0"></div></section>
  <section class="sw" id="p-switch" aria-labelledby="h-switch"><h2 id="h-switch">Nintendo Switch <span class="count" id="n-switch">0</span></h2><div class="body" id="t-switch" tabindex="0"></div></section>
</main>

<footer><span>모든 시각은 한국시간(KST, UTC+9) 기준 · 출처: <span id="src">-</span></span><span id="loaded"></span></footer>
</div>

<script>
(function(){
  const KST_OFFSET = 9*3600*1000;
  const DAYS = ['일','월','화','수','목','금','토'];
  const KEYS = ['steam','playstation','switch'];
  const pad = n => String(n).padStart(2,'0');
  // KST 기준 날짜 구성요소 (브라우저 시간대와 무관)
  function kst(d){ const k=new Date((d||new Date()).getTime()+KST_OFFSET);
    return {y:k.getUTCFullYear(),m:k.getUTCMonth()+1,d:k.getUTCDate(),w:k.getUTCDay(),h:k.getUTCHours(),mi:k.getUTCMinutes(),s:k.getUTCSeconds()}; }
  const ymd = t => `${t.y}-${pad(t.m)}-${pad(t.d)}`;
  const fmt = t => `${t.y}.${pad(t.m)}.${pad(t.d)} (${DAYS[t.w]}) ${pad(t.h)}:${pad(t.mi)}`;
  const fmtShort = t => `${pad(t.m)}.${pad(t.d)} (${DAYS[t.w]}) ${pad(t.h)}:${pad(t.mi)}`;
  const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const cell = v => { v=(v==null||v==='')?'':String(v); return v==='미확인'?'<span class="unk">미확인</span>':esc(v); };
  const chip = (k,v) => `<span class="chip"><span class="k">${k}</span><span class="v">${cell(v||'미확인')}</span></span>`;
  // '한글명 (English Title)' → 영문 괄호 부분만 살짝 흐리게 (텍스트는 그대로)
  const title = v => { v=v||'미확인'; if(v==='미확인') return cell(v);
    const m=String(v).match(/^(.*?)(\s*\([^()]*\))$/); return m?esc(m[1])+'<span class="en">'+esc(m[2])+'</span>':esc(v); };

  const loadedDay = ymd(kst());

  function render(data, source){
    const t=kst();
    document.getElementById('today').textContent = `${t.y}년 ${t.m}월 ${t.d}일 (${DAYS[t.w]}) · 한국시간`;
    let up = data.updatedAt ? new Date(data.updatedAt) : null;
    document.getElementById('updated').textContent = (up && !isNaN(up)) ? fmtShort(kst(up)) + ' KST' : '미확인';
    document.getElementById('src').textContent = source;
    const w=document.getElementById('warn');
    if(data.date && data.date!==ymd(t)){ w.style.display='block';
      w.textContent=`⚠ 표시 중인 데이터 날짜(${data.date})가 오늘(${ymd(t)})과 다릅니다. 데이터 갱신을 확인하세요.`; }
    else w.style.display='none';
    KEYS.forEach(k=>{
      const rows=(data.platforms&&data.platforms[k])||[];
      document.getElementById('n-'+k).textContent=rows.length;
      const el=document.getElementById('t-'+k);
      if(!rows.length){ el.innerHTML='<div class="empty">오늘 출시 예정 게임 없음</div>'; return; }
      el.innerHTML='<ul class="list">'+rows.map(r=>
        `<li class="card"><h3>${title(r.title)}</h3>`+
        `<div class="chips">${chip('장르',r.genre)}${chip('개발/유통',r.publisher)}${chip('가격',r.price)}`+
        (r.note?`<span class="note">${cell(r.note)}</span>`:'')+'</div></li>').join('')+'</ul>';
    });
  }

  function inlineData(){ try{ return JSON.parse(document.getElementById('inline-data').textContent); }catch(e){ return null; } }

  function load(){
    const fb=()=>{ const d=inlineData(); if(d) render(d,'내장 데이터(폴백)'); else { const w=document.getElementById('warn'); w.style.display='block'; w.textContent='데이터를 불러올 수 없습니다.'; } };
    if(location.protocol==='file:' || !window.fetch){ // file:// 에서는 fetch가 대부분 막힘 → 시도 후 폴백
      try{ fetch('https://raw.githubusercontent.com/namkh2-debug/game-releases/main/data.json?_='+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json();}).then(d=>render(d,'data.json')).catch(fb); }catch(e){ fb(); }
      return;
    }
    fetch('https://raw.githubusercontent.com/namkh2-debug/game-releases/main/data.json?_='+Date.now(),{cache:'no-store'}).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(d=>render(d,'data.json')).catch(fb);
  }

  // 다음 KST 09:00 (= UTC 00:00) 까지 남은 ms
  function msUntilNext9(){ const now=Date.now(); const d=new Date(now);
    let target=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()+1,0,0,5); // 09:00:05 KST
    return target-now; }
  function scheduleReload(){
    const ms=msUntilNext9();
    document.getElementById('next').textContent=fmtShort(kst(new Date(Date.now()+ms)))+' KST';
    // 절전 등으로 지연될 수 있어 5분 체크로 보완
    setTimeout(()=>location.reload(), ms);
  }
  // 5분마다: 날짜 변경 또는 09:00 경과 여부 체크
  const reloadAt = Date.now()+msUntilNext9();
  const check=()=>{ if(ymd(kst())!==loadedDay || Date.now()>=reloadAt) location.reload(); };
  setInterval(check, 5*60*1000);
  // 백그라운드 탭/절전 복귀 시 즉시 확인
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') check(); });
  window.addEventListener('focus', check);
  // 시계
  function tick(){ const t=kst(); document.getElementById('clock').textContent=`${pad(t.h)}:${pad(t.mi)}:${pad(t.s)}`; }
  setInterval(tick,1000); tick();
  document.getElementById('loaded').textContent='페이지 로드: '+fmt(kst())+' KST';

  load(); scheduleReload();
})();
</script>
</body>
